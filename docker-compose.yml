services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: twc
      MYSQL_USER: twc
      MYSQL_PASSWORD: twc_dev_password
      MYSQL_ROOT_PASSWORD: twc_root_password
    ports:
      - "3306:3306"
    volumes:
      - twc_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utwc", "-ptwc_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  twc_mysql:
